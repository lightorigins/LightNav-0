[project]
name = "vln-mujoco"
version = "0.1.0"
description = "A small robot-backend VLN simulator in one MolmoSpaces scene."
readme = "README.md"
authors = [{ name = "Light Origins" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "casadi>=3.7,<4",
    "mujoco>=3.3",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
microduck = ["onnxruntime>=1.24"]

[project.scripts]
vln-mujoco = "vln_mujoco.__main__:main"

[project.urls]
Homepage = "https://www.lightorigins.com/en"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vln_mujoco*"]

[tool.setuptools.package-data]
vln_mujoco = ["web/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
